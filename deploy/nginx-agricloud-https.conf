server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ysngj.cn 8.217.147.235;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/agricloud/frontend;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ysngj.cn$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name ysngj.cn;

    ssl_certificate /etc/letsencrypt/live/ysngj.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ysngj.cn/privkey.pem;
    # Keep the native uni-app/vivo TLS stack on the broadly compatible path.
    # TLS 1.3 currently fails during key-share negotiation on affected devices.
    ssl_protocols TLSv1.2;
    ssl_session_cache shared:agricloud_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/agricloud/frontend;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;

    access_log /var/log/nginx/agricloud.access.log;
    error_log /var/log/nginx/agricloud.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }
}
